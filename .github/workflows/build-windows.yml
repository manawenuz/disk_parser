name: Build Windows Binary

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        
    - name: Build Windows AMD64 release
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Package Windows AMD64 binary
      shell: pwsh
      run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/disk_parser.exe -DestinationPath disk_parser-windows-amd64.zip
      
    - name: Upload Windows AMD64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: disk_parser-windows-amd64
        path: disk_parser-windows-amd64.zip

    - name: Publish GitHub release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" disk_parser-windows-amd64.zip --repo "${{ github.repository }}" --generate-notes
